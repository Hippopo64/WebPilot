[project]
name = "webpilot"
version = "0.1.0"
description = "MCP server exposing Playwright tools over SSE/HTTP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hippolyte Dupont" }]

dependencies = [
  "playwright>=1.47",
  "mcp[cli]>=1.7",
  "starlette>=0.38",
  "uvicorn>=0.30",
  "litellm",
  "python-dotenv"
]

[project.scripts]
# Si ton futur serveur SSE est dans src/webpilot/server_sse.py :
webpilot-sse = "webpilot.server_sse:main"
# Si ton futur serveur HTTP est dans src/webpilot/server_http.py :
webpilot-http = "webpilot.server_http:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = [
  "."
]